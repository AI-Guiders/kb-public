onboarding = "Start with ooa vs ood; noun-verb; SOLID/patterns only after responsibilities. Pattern-first = mc-pattern-first. High-abuse GoF: singleton, factory-method, strategy, observer. C# traps: dispose, HttpClient, multipass IEnumerable, culture, logs/PII, mutable static, ValueTask, async void, ConfigureAwait, CT propagate, AOT, vulnerable packages, DI captive. Before mutate: blast-radius + mutation-blast-bound."
